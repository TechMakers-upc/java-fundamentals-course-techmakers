name: Java Course Automated Tests

on:
  push:
    branches:
      - main
      - feature/java-course-tests-diego
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-java-lessons:
    name: Compile and test Java lessons
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run automated Java tests
        run: bash scripts/test-java-examples.sh
